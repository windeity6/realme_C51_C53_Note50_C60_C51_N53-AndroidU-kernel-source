name: Unisoc Kernel Builder

on:
  workflow_dispatch: # Позволяет запускать сборку вручную через сайт GitHub

jobs:
ssh-job:
    runs-on: ubuntu-latest # Выберите ubuntu-22.04 / ubuntu-24.04 если нужно конкретное окружение
    steps:
      - name: Start SSH Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
