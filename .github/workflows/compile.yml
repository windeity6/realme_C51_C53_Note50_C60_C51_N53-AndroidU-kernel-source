name: SSH Connect
on: [push, workflow_dispatch]

jobs:
  ssh-job:
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH Session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
          limit-access-to-actor: false
          install-dependencies: true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel-Image
          path: /home/runner/work/realme_C51_C53_Note50_C60_C51_N53-AndroidU-kernel-source/realme_C51_C53_Note50_C60_C51_N53-AndroidU-kernel-source/Image
