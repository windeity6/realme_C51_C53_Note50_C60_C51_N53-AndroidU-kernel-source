name: macOS VNC GUI
on: [push, workflow_dispatch]

jobs:
  macos-vnc-job:
    runs-on: macos-14 # Настоящее железо Apple Mac
    steps:
      - name: Enable macOS Screen Sharing (VNC)
        run: |
          # 1. Задаем пароль для пользователя runner
          echo "kernel_build_2026" | sudo chpasswd
          
          # 2. Включаем официальный встроенный VNC-сервер macOS
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpw -vncpw kernel_build_2026
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate
          
          # 3. Скачиваем утилиту туннеля для macOS
          curl -sL https://github.com | gunzip > chisel
          chmod +x chisel
          
          # 4. Пробрасываем стандартный порт VNC (5900) наружу
          echo "=== ССЫЛКА ДЛЯ ПОДКЛЮЧЕНИЯ НИЖЕ ==="
          ./chisel client https://herokuapp.com R:5900:localhost:5900 2>&1 | tee chisel.log &
          
          # Ждем поднятия туннеля
          sleep 5
          cat chisel.log
          
          # Держим мак запущенным (до 6 часов)
          echo "Для закрытия сессии введите в терминале мака: touch /tmp/done"
          until [ -f /tmp/done ]; do sleep 5; done
